<!DOCTYPE html>
<html>
    <head>
        <title>CatHub</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">

        <style>
            body {
                background: linear-gradient(-45deg, pink, hotpink, lightpink, deeppink);
                background-size: 400% 400%;
                min-height: 100vh;
                margin: 0;
                animation: gradientmove 10s linear infinite;
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 20px 10px;
            }

            @keyframes shine {
                0% { transform: scale(0.8); opacity: 0.5; }
                100% { transform: scale(1.3); opacity: 1; }
            }
            @keyframes gradientmove {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
            @keyframes floatandfade {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0px);
                }
            }
            #particle-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                pointer-events: none;
                z-index: 0;
            }
            .particle {
                position: absolute;
                border-radius: 50%;
                animation: shine 3s ease-in-out infinite alternate;
            }
        </style>
    </head>

    <body>
        <div class="title-container" style="position: relative; display: inline-block; z-index: 1; margin-top: 50px;">
            <h1 style="
                font-size: 100px;
                font-weight: 900;
                font-family: 'Playwrite GB J', cursive;
                font-style: normal;
                animation: floatandfade 2s ease-in-out 1 forwards;
                position: relative;">
                <span style="color: white;">Cat </span><span style="color: blue;">Hub</span>
            </h1>
        </div>

        <p style="font-size: 24px; color: rgb(0, 0, 0); font-weight: bold; margin-top: 20px; z-index: 1; text-shadow: 1px 1px 5px rgba(0,0,0,0.2); position: relative;">
            Welcome to the ultimate cat corner!
        </p>
        <div style="margin-top: 600px; color: rgb(0, 0, 0); font-size: 20px; position: relative; z-index: 1;">
            Keep scrolling down... 🐾
        </div>
        <div style="margin-top: 500px; color: rgb(0, 0, 0); font-size: 20px; position: relative; z-index: 1;">
            You reached the bottom of the hub! 🐱
        </div>
        
        <div id="particle-container"></div>

        <script>
            const particles = [];
            const particleContainer = document.getElementById('particle-container');
            const particleCount = 60;

            for (let i = 0; i < particleCount; i++) {
                createParticle(true);
            }

            function createParticle(isInitialLoad = false) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;

                particle.style.backgroundColor = Math.random() > 0.5 ? 'white' : 'yellow';
                particle.style.boxShadow = particle.style.backgroundColor === 'white' 
                    ? '0 0 10px white' 
                    : '0 0 10px yellow';
                
                const xPos = Math.random() * 100;
                particle.style.left = `${xPos}%`;

                // FIXED: Repaired broken ternary syntax selector
                const yPos = isInitialLoad ? Math.random() * 100 : 105;
                particle.style.top = `${yPos}vh`;

                particleContainer.appendChild(particle);

                particles.push({
                    element: particle,
                    x: xPos,
                    y: yPos,
                    speed: 0.1 + Math.random() * 0.15,
                    parallaxSpeed: 0.05 + Math.random() * 0.15,
                    opacity: isInitialLoad ? Math.random() : 0
                });
            }

            function animateParticles() {
                const scrollTop = window.scrollY;

                
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];

                    
                    p.y -= p.speed + (scrollTop * p.parallaxSpeed * 0.001);

              
                    if (p.opacity < 1 && p.y > 15) {
                        p.opacity += 0.01;
                    }

                    
                    if (p.y < 15) {
                        p.opacity -= 0.01;
                    }

                    
                    p.element.style.top = `${p.y}vh`;
                    p.element.style.opacity = p.opacity;

                    
                    if (p.y < -5 || p.opacity <= 0) {
                        p.element.remove();
                        particles.splice(i, 1);
                        createParticle(false); 
                    }
                }

                requestAnimationFrame(animateParticles);
            }

            requestAnimationFrame(animateParticles);
        </script>
    </body>
</html>
