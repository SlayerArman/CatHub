<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <title>CatHub Games</title>
        <style>
            *{box-sizing: border-box;}
            
            .my-button:hover {cursor: url("assets/paw.png")16 16, pointer;}

            :root{
                --bg: #fff8fb;
                --surface: #ffffff;
                --surface2: #fff3f7;
                --primary: #f472b6;
                --primary-hover: #ec4899;
                --secondary: #ffd166;
                --text: #3a3140;
                --text-muted: #7d7082;
                --border: #f4d7e4;
                --shadow: 0 10px 30px rgba(244,114,182,.12);
            }

            body
            {
                text-align: center;
                font-family: 'Inter', system-ui, sans-serif;
                color: var(--text);
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                background:
                    radial-gradient(circle at top,
                    #fff7d8 0%,
                    #fff4fa 45%,
                    #fff0f6 100%);
            }

            @keyframes gradientBG {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            h1
            {
                font-size:3rem;
                font-weight:700;
            }

            nav
            {
                display:flex;
                justify-content:center;
                align-items:center;
                gap:10px;

                width:fit-content;
                margin:20px auto 40px;

                padding:8px;

                background:#fff;
                border:1px solid var(--border);
                border-radius:14px;
            }

            nav button
            {
                background:none;
                color:#9ca3af;
                border-radius:8px;
            }

            nav button.active{
                background:#7c9cff;
                color:white;
            }

            nav button:hover:not(.active)
            {
                color: #cccccc;
                background: rgba(255, 255, 255, 0.06);
            }

            #game-container
            {
                max-width: 600px;
                margin: 0 auto;
            }

            .game-view
            {
                display: none;
                background: var(--surface);
                padding: 30px;
                border-radius: 20px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow);
            }

            .game-view.active
            {
                display: block;
            }

            @keyframes fadeIn
            {
                from{opacity: 0; transform: translateY(10px);}
                to{opacity: 1; transform: translateY(0);}
            }

            /*Cat Clicker*/
            .clicker-box{display: flex; flex-direction: column; align-items: center;}

           #cat-btn
           {
                background:none;
                border:none;
                cursor:pointer;
                transition:transform .15s ease;
            }

            #cat-btn:hover
            {
                transform:scale(1.05);
            }

            #cat-btn:active
            {
                transform:scale(.95);
            }

            #cat-btn img
            {
                width:140px;
                height:140px;
                object-fit:contain;
                user-select:none;
                pointer-events:none;
            }

            #cat-btn img
            {
                transition:transform .08s;
            }

            #cat-btn:active img
            {
                transform:scale(.9);
            }
            
            .stat-container{display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; justify-content: center;}
            .stat
            {
                background:#fff9fc;
                border:1px solid var(--border);
                border-radius:10px;
                padding:10px 18px;
                color:var(--text);
            }
            .stat span{color: var(--primary);}

           .upgrade-btn
           {
                padding:12px 22px;
                border:none;
                border-radius:12px;
                background:#ffd166;
                color:#5c4200;
                font-weight:600;
            }
            .upgrade-btn:hover
            {
                background: var(--primary-hover);
            }

            .upgrade-btn:disabled
            {
                    background-color: #2a2a2a;
                    color: #555555;
                    cursor: not-allowed;
            }
            #buy-feeder.upgrade-btn:enabled
            {
                background-color: #2ed573;
                color: white;
                box-shadow: 0 4px 12px rgba(46, 213, 115, 0.2);
            }

            #buy-feeder
            {
                background: var(--secondary);
                color:#5b4300;
            }

            /*Cat Memory Match*/
            .grid-container
            {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .memory-grid
            {
                display: grid;
                grid-template-columns: repeat(4, 80px);
                gap: 12px;
                justify-content: center;
            }

            .card
            {
                width: 80px;
                height: 80px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                cursor: pointer;
                user-select: none;
                transition: all 0.2s ease;
                background:#181b22;
                border:1px solid #2d323d;
                box-shadow:0 10px 30px rgba(0,0,0,.25);
            }

            .card:hover:not(.flipped):not(.matched){background: #2c2c2c;}

            .card.flipped
            {
                background: var(--primary);
                transform: rotateY(180deg);
            }
            .card.matched{background: #2ed573; color: white; cursor: default; transform: scale(0.95); opacity: 0.7;}

            #memory-msg{font-size: 1.2rem; font-weight: bold; color: #2ed573; height: 24px;}

            /*Whack-A-Mouse*/
            .whack-grid
            {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                gap: 15px;
                justify-content: center;
                margin-top: 20px;
            }

            .hole
            {
                width:100px;
                height:100px;
                border-radius:50%;
                background:#111;
                overflow:hidden;
                position:relative;
            }

            .mouse
            {
                position:absolute;
                left:50%;
                bottom:-70px;
                transform:translateX(-50%);
                width:70px;
                height:70px;
                background:url("../assets/mouse.png") center/contain no-repeat;
                transition:bottom .15s ease;
            }

            .mouse.up
            {
                bottom:8px;
            }

            /*Falling Treats*/
            .catch-area
            {
                width: 100%;
                max-width: 400px;
                height: 300px;
                background: #111111;
                margin: 20px auto;
                position: relative;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
            }

            #catcher-cat
            {
                font-size: 2.5rem;
                position: absolute;
                bottom: 5px;
                left: 50%;
                transform: translateX(-50%);
                transition: left 0.1s linear;
                user-select: none;
            }

            .falling-item
            {
                font-size: 2rem;
                position: absolute;
                top: -40px;
                user-select: none;
            }

            .catch-hint{font-size: 0.85rem; color: #888888; margin-top: -8px;}

            /*Laser Chase*/
            .laser-area
            {
                width: 100%;
                max-width: 400px;
                height: 300px;
                background: #0a0a0a;
                margin: 20px auto;
                position: relative;
                border-radius: 15px;
                overflow: hidden;
                cursor: crosshair;
                box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6);
            }

            #laser-dot
            {
                position: absolute;
                border-radius: 50%;
                width: 16px;
                height: 16px;
                background: #ff0044;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 10px #ff0044, 0 0 20px #ff0044;
                transition: top 0.15s ease, left 0.15s ease;
                pointer-events: auto;
            }

            footer{margin-top: 30px; color: #666666; font-size: 0.85rem;}

            @media (max-width: 480px)
            {
                body{padding: 10px;}
                .game-view{padding: 18px;}
                #cat-btn{font-size: 60px;}
                .stat{font-size: 1rem; padding: 8px 12px;}
                .memory-grid{grid-template-columns: repeat(4, 65px);}
                .card{width: 65px; height: 65px; font-size: 1.6rem;}
                .whack-grid{grid-template-columns: repeat(3, 85px);}
                .hole{width: 85px; height: 85px;}
                .mouse{font-size: 2.4rem;}
                nav button{padding: 10px 16px; font-size: 0.9rem;}
            }
        </style>
    </head>

    <div id="cursor"></div>

    <body>
        <h1>🐾 CatHub Games 🐾</h1>

        <nav>
            <button id="nav-clicker" onclick="switchGame('cat-clicker')" class="active">Cat Clicker</button>
            <button id="nav-memory" onclick="switchGame('cat-memory')">Cat Memory Match</button>
            <button id="nav-whack" onclick="switchGame('whack-a-mouse')">Whack-A-Mouse</button>
            <button id="nav-catch" onclick="switchGame('falling-treats')">Falling Treats</button>
            <button id="nav-laser" onclick="switchGame('laser-chase')">Laser Chase</button>
        </nav>

        <div id="game-container">
            <div id="cat-clicker" class="game-view active">
                <div class="clicker-box">
                    <h2>Cat Clicker</h2>
                    <div class="stat-container">
                        <div class="stat">Treats: <span id="treat-count">0</span></div>
                        <div class="stat">Per Sec: <span id="cps">0.0</span></div>
                    </div>
                    <button id="cat-btn">
                        <img src="../assets/cat.png" alt="Cat">
                    </button>
                    <button id="buy-feeder" class="upgrade-btn">Buy Auto-Feeder (Cost: 10)</button>
                </div>
            </div>

            <div id="whack-a-mouse" class="game-view">
                <div class="grid-container">
                    <h2>Whack-A-Mouse 🐭</h2>
                    <div class="stat-container">
                        <div class="stat">Score: <span id="whack-score">0</span></div>
                        <div class="stat">Time: <span id="whack-timer">30</span>s</div>
                        <div class="stat">Best: <span id="whack-best">0</span></div>
                    </div>
                    <div id="whack-msg" style="color: var(--primary); font-weight: bold; height: 24px;"></div>
                    <div id="whack-grid" class="whack-grid"></div>
                    <button onclick="initWhackGame()" class="upgrade-btn">Start Game</button>
                </div>
            </div>

            <div id="falling-treats" class="game-view">
                <div class="grid-container">
                    <h2>Falling Treats 🐟</h2>
                    <div class="stat-container">
                        <div class="stat">Caught: <span id="catch-score">0</span></div>
                        <div class="stat">Lives: <span id="catch-lives">3</span></div>
                        <div class="stat">Best: <span id="catch-best">0</span></div>
                    </div>
                    <div id="catch-msg" style="color: var(--primary); font-weight:bold; height: 24px;"></div>
                    <div id="catch-area" class="catch-area">
                        <div id="catcher-cat">🐱</div>
                    </div>
                    <div class="catch-hint">Use ← and → to move</div>
                    <button onclick="initCatchGame()" class="upgrade-btn">Start Game</button>
                </div>
            </div>

            <div id="laser-chase" class="game-view">
                <div class="grid-container">
                    <h2>Laser Chase 🔴</h2>
                    <div class="stat-container">
                        <div class="stat">Catches: <span id="laser-score">0</span></div>
                        <div class="stat">Time: <span id="laser-timer">20</span>s</div>
                        <div class="stat">Best: <span id="laser-best">0</span></div>
                    </div>
                    <div id="laser-msg" style="color: var(--primary); font-weight: bold; height: 24px;"></div>
                    <div id="laser-area" class="laser-area">
                        <div id="laser-dot"></div>
                    </div>
                    <button onclick="initLaserGame()" class="upgrade-btn">Start Game</button>
                </div>
            </div>

            <div id="cat-memory" class="game-view">
                <div class="grid-container">
                    <h2>Cat Memory Match</h2>
                    <div class="stat-container">
                        <div class="stat">Time: <span id="memory-timer">0</span>s</div>
                        <div class="stat">Best Time: <span id="memory-best">--</span>s</div>
                    </div>
                    <div id="memory-msg"></div>
                    <div id="memory-grid" class="memory-grid"></div>
                    <button onclick="initMemoryGame()" class="upgrade-btn">Restart Game</button>
                </div>
            </div>
        </div>

        <footer>Made with ❤️ by Arman Ahmad</footer>

        <script>
            let clickerInterval = null;
            let memoryTimerInterval = null;
            let whackTimerInterval = null;
            let catchInterval = null;
            let laserTimerInterval = null;
            let whackPopInterval = null;

            const cursor = document.getElementById("cursor");

            let mouseX = 0;
            let mouseY = 0;

            let currentX = 0;
            let currentY = 0;

            document.addEventListener("mousemove", (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateCursor() {

                currentX += (mouseX - currentX) * 0.1;
                currentY += (mouseY - currentY) * 0.1;

                cursor.style.left = currentX + "px";
                cursor.style.top = currentY + "px";

                requestAnimationFrame(animateCursor);
            }

            animateCursor();

            function switchGame(gameId)
            {
                document.querySelectorAll('.game-view').forEach(view => view.classList.remove('active'));
                document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));

                if (clickerInterval) { clearInterval(clickerInterval); clickerInterval = null; }
                if (memoryTimerInterval) { clearInterval(memoryTimerInterval); memoryTimerInterval = null; }
                if (whackTimerInterval) { clearInterval(whackTimerInterval); whackTimerInterval = null; }
                if (whackPopInterval) { clearTimeout(whackPopInterval); whackPopInterval = null; }
                if (catchInterval) { clearInterval(catchInterval); catchInterval = null; }
                if (laserTimerInterval) { clearInterval(laserTimerInterval); laserTimerInterval = null; }

                document.getElementById(gameId).classList.add('active');
                if (gameId === 'cat-clicker') document.getElementById('nav-clicker').classList.add('active');
                if (gameId === 'cat-memory') document.getElementById('nav-memory').classList.add('active');
                if (gameId === 'whack-a-mouse') document.getElementById('nav-whack').classList.add('active');
                if (gameId === 'falling-treats') document.getElementById('nav-catch').classList.add('active');
                if (gameId === 'laser-chase') document.getElementById('nav-laser').classList.add('active');

                if (gameId === 'cat-clicker') {
                    initClickerGame();
                } else if (gameId === 'cat-memory') {
                    initMemoryGame();
                } else if (gameId === 'whack-a-mouse') {
                    initWhackGame();
                } else if (gameId === 'falling-treats') {
                    initCatchGame();
                } else if (gameId === 'laser-chase') {
                    initLaserGame();
                }
            }

            // Cat Clicker Logic
            let clickerState = {treats: 0, feeders: 0, cost: 10};

            function initClickerGame()
            {
                const saved = JSON.parse(localStorage.getItem('catGameSave'));
                if (saved) clickerState = saved;

                updateClickerDisplay();

                if (clickerInterval) clearInterval(clickerInterval);

                clickerInterval = setInterval(() => {
                    clickerState.treats += (clickerState.feeders * 0.1);
                    updateClickerDisplay();
                }, 100);
            }

            function updateClickerDisplay()
            {
                document.getElementById('treat-count').innerText = Math.floor(clickerState.treats);
                document.getElementById('cps').innerText = (clickerState.feeders * 1).toFixed(1);

                const btn = document.getElementById('buy-feeder');
                btn.innerText = `Buy Auto-Feeder (Cost: ${clickerState.cost})`;
                btn.disabled = (clickerState.treats < clickerState.cost);

                localStorage.setItem('catGameSave', JSON.stringify(clickerState));
            }

            document.getElementById('cat-btn').addEventListener('click', () => {
                clickerState.treats++;
                updateClickerDisplay();
            });

            document.getElementById('buy-feeder').addEventListener('click', () => {
                if (clickerState.treats >= clickerState.cost) {
                    clickerState.treats -= clickerState.cost;
                    clickerState.feeders++;
                    clickerState.cost = Math.floor(clickerState.cost * 1.5);
                    updateClickerDisplay();
                }
            });

            //Cat Memory Match Logic
            let hasFlippedCard = false;
            let lockBoard = false;
            let firstCard, secondCard;
            let matchedPairs = 0;
            let memorySecondsElapsed = 0;

            const catEmojis = ['🐱', '😻', '😸', '🙀', '😽', '😹', '😾', '🦁'];

            function shuffle(array)
            {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function initMemoryGame()
            {
                const grid = document.getElementById('memory-grid');
                const msg = document.getElementById('memory-msg');
                grid.innerHTML = '';
                msg.innerText = '';
                matchedPairs = 0;
                resetBoardState();

                if (memoryTimerInterval) clearInterval(memoryTimerInterval);
                memorySecondsElapsed = 0;
                document.getElementById('memory-timer').innerText = memorySecondsElapsed;

                const savedBest = localStorage.getItem('catMemoryBestTime');
                document.getElementById('memory-best').innerText = savedBest ? savedBest : '--';

                memoryTimerInterval = setInterval(() => {
                    memorySecondsElapsed++;
                    document.getElementById('memory-timer').innerText = memorySecondsElapsed;
                }, 1000);

                const memoryCards = shuffle([...catEmojis, ...catEmojis]);

                memoryCards.forEach((emoji, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.emoji = emoji;
                    card.dataset.index = index;
                    card.innerText = '🐾';
                    card.addEventListener('click', flipCard);
                    grid.appendChild(card);
                });
            }

            function flipCard()
            {
                if (lockBoard) return;
                if (this === firstCard) return;
                if (this.classList.contains('matched')) return;

                this.classList.add('flipped');
                this.innerText = this.dataset.emoji;

                if (!hasFlippedCard) {
                    hasFlippedCard = true;
                    firstCard = this;
                    return;
                }

                secondCard = this;
                checkForMatch();
            }

            function checkForMatch()
            {
                let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
                isMatch ? disableCards() : unflipCards();
            }

            function disableCards()
            {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                matchedPairs++;

                if (matchedPairs === catEmojis.length) {
                    clearInterval(memoryTimerInterval);
                    document.getElementById('memory-msg').innerText = `🎉 You found all the cats in ${memorySecondsElapsed}s! Meow-velous!`;

                    const savedBest = localStorage.getItem('catMemoryBestTime');
                    if (!savedBest || memorySecondsElapsed < parseInt(savedBest)) {
                        localStorage.setItem('catMemoryBestTime', memorySecondsElapsed);
                        document.getElementById('memory-best').innerText = memorySecondsElapsed;
                        document.getElementById('memory-msg').innerText += " 🏆 New Best Time!";
                    }
                }
                resetBoardState();
            }

            function unflipCards()
            {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    firstCard.innerText = '🐾';
                    secondCard.innerText = '🐾';
                    resetBoardState();
                }, 1000);
            }

            function resetBoardState()
            {
                [hasFlippedCard, lockBoard] = [false, false];
                [firstCard, secondCard] = [null, null];
            }

            // Whack a mouse logic
            let whackScore = 0;
            let whackTimeLeft = 30;

            function initWhackGame()
            {
                const grid = document.getElementById('whack-grid');
                grid.innerHTML = '';
                whackScore = 0;
                whackTimeLeft = 30;
                document.getElementById('whack-score').innerText = whackScore;
                document.getElementById('whack-timer').innerText = whackTimeLeft;
                document.getElementById('whack-msg').innerText = '';

                const savedBestWhack = localStorage.getItem('whackBest') || 0;
                document.getElementById('whack-best').innerText = savedBestWhack;

                for (let i = 0; i < 6; i++) {
                    const hole = document.createElement('div');
                    hole.classList.add('hole');
                    const mouse = document.createElement('div');
                    mouse.classList.add('mouse');
                    mouse.addEventListener('click', whackMouse);
                    hole.appendChild(mouse);
                    grid.appendChild(hole);
                }

                if (whackTimerInterval) clearInterval(whackTimerInterval);
                if (whackPopInterval) clearTimeout(whackPopInterval);

                whackTimerInterval = setInterval(() => {
                    whackTimeLeft--;
                    document.getElementById('whack-timer').innerText = whackTimeLeft;
                    if (whackTimeLeft <= 0) {
                        clearInterval(whackTimerInterval);
                        clearTimeout(whackPopInterval);
                        document.getElementById('whack-msg').innerText = `Time's up! You whacked ${whackScore} mice!`;
                        document.querySelectorAll('.mouse').forEach(m => m.classList.remove('up'));

                        if (whackScore > savedBestWhack) {
                            localStorage.setItem('whackBest', whackScore);
                            document.getElementById('whack-best').innerText = whackScore;
                            document.getElementById('whack-msg').innerText += " 🏆 New Best!";
                        }
                    }
                }, 1000);

                function popMouse()
                {
                    const mice = document.querySelectorAll('.mouse');
                    mice.forEach(m => m.classList.remove('up'));
                    if (whackTimeLeft > 0) {
                        const randomMouse = mice[Math.floor(Math.random() * mice.length)];
                        randomMouse.classList.add('up');
                        const popTime = Math.random() * (1000 - 400) + 400;
                        whackPopInterval = setTimeout(popMouse, popTime);
                    }
                }
                popMouse();
            }

            function whackMouse(e)
            {
                if (!e.target.classList.contains('up')) return;
                whackScore++;
                document.getElementById('whack-score').innerText = whackScore;
                e.target.classList.remove('up');
            }

            // Falling Treats logic
            let catchScore = 0;
            let catchLives = 3;
            let catcherPos = 50;

            document.addEventListener('keydown', (e) => {
                const catchGameView = document.getElementById('falling-treats');
                if (!catchGameView.classList.contains('active')) return;
                if (catchLives <= 0) return;

                const catcher = document.getElementById('catcher-cat');
                if (e.key === 'ArrowLeft' && catcherPos > 5) catcherPos -= 10;
                if (e.key === 'ArrowRight' && catcherPos < 95) catcherPos += 10;
                catcher.style.left = `${catcherPos}%`;
            });

            function initCatchGame()
            {
                document.querySelectorAll('.falling-item').forEach(item => item.remove());

                catchScore = 0;
                catchLives = 3;
                catcherPos = 50;
                document.getElementById('catcher-cat').style.left = '50%';
                document.getElementById('catch-score').innerText = catchScore;
                document.getElementById('catch-lives').innerText = catchLives;
                document.getElementById('catch-msg').innerText = '';

                const savedBestCatch = localStorage.getItem('catchBest') || 0;
                document.getElementById('catch-best').innerText = savedBestCatch;

                if (catchInterval) clearInterval(catchInterval);

                catchInterval = setInterval(() => {
                    if (Math.random() < 0.05) spawnItem();
                    moveItems();
                }, 50);
            }

            function spawnItem()
            {
                const area = document.getElementById('catch-area');
                const item = document.createElement('div');
                item.classList.add('falling-item');
                const isBad = Math.random() < 0.3;
                item.innerText = isBad ? '💧' : (Math.random() < 0.5 ? '🐟' : '🥛');
                item.dataset.type = isBad ? 'bad' : 'good';
                item.style.left = `${Math.random() * 90 + 5}%`;
                item.style.top = '-40px';
                area.appendChild(item);
            }

            function moveItems()
            {
                const items = document.querySelectorAll('.falling-item');
                const catcher = document.getElementById('catcher-cat');
                const catcherRect = catcher.getBoundingClientRect();

                items.forEach(item => {
                    let top = parseFloat(item.style.top);
                    top += 6;
                    item.style.top = `${top}px`;

                    const itemRect = item.getBoundingClientRect();

                    if (itemRect.bottom >= catcherRect.top &&
                        itemRect.top <= catcherRect.bottom &&
                        itemRect.right >= catcherRect.left &&
                        itemRect.left <= catcherRect.right) {
                        if (item.dataset.type === 'bad') {
                            catchLives--;
                            document.getElementById('catch-lives').innerText = catchLives;
                        } else {
                            catchScore++;
                            document.getElementById('catch-score').innerText = catchScore;
                        }
                        item.remove();

                        if (catchLives <= 0) {
                            clearInterval(catchInterval);
                            document.getElementById('catch-msg').innerText = `Game Over! You caught ${catchScore} treats!`;

                            const currentBestCatch = localStorage.getItem('catchBest') || 0;
                            if (catchScore > currentBestCatch) {
                                localStorage.setItem('catchBest', catchScore);
                                document.getElementById('catch-best').innerText = catchScore;
                                document.getElementById('catch-msg').innerText += " 🏆 New Best!";
                            }

                            document.querySelectorAll('.falling-item').forEach(i => i.remove());
                        }
                    } else if (top > 300) {
                        item.remove();
                    }
                });
            }

            /* Laser Chase Logic*/
            let laserScore = 0;
            let laserTimeLeft = 20;

            function initLaserGame()
            {
                laserScore = 0;
                laserTimeLeft = 20;
                document.getElementById('laser-score').innerText = laserScore;
                document.getElementById('laser-timer').innerText = laserTimeLeft;
                document.getElementById('laser-msg').innerText = '';

                const savedBestLaser = localStorage.getItem('laserBest') || 0;
                document.getElementById('laser-best').innerText = savedBestLaser;

                const dot = document.getElementById('laser-dot');
                dot.style.top = '50%';
                dot.style.left = '50%';

                dot.addEventListener('click', catchLaser);

                if (laserTimerInterval) clearInterval(laserTimerInterval);

                laserTimerInterval = setInterval(() => {
                    laserTimeLeft--;
                    document.getElementById('laser-timer').innerText = laserTimeLeft;

                    if (laserTimeLeft <= 0) {
                        clearInterval(laserTimerInterval);
                        document.getElementById('laser-msg').innerText = `Time's Up! You caught it ${laserScore} times!`;
                        dot.removeEventListener('click', catchLaser);
                        if (laserScore > savedBestLaser) {
                            localStorage.setItem('laserBest', laserScore);
                            document.getElementById('laser-best').innerText = laserScore;
                            document.getElementById('laser-msg').innerText += " 🏆 New Best!";
                        }
                    } else if (Math.random() < 0.5) {
                        moveLaser();
                    }
                }, 1000);
            }

            function catchLaser()
            {
                if (laserTimeLeft > 0) {
                    laserScore++;
                    document.getElementById('laser-score').innerText = laserScore;
                    moveLaser();
                }
            }

            function moveLaser()
            {
                const dot = document.getElementById('laser-dot');
                const newTop = Math.random() * 90 + 5;
                const newLeft = Math.random() * 90 + 5;
                dot.style.top = `${newTop}%`;
                dot.style.left = `${newLeft}%`;
            }
            
            initClickerGame();
        </script>
    </body>
