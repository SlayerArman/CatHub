<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Myths & Facts</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            ::selection
            {
                background: #fd94c3;
                color: #111827;
            }
            body {
                cursor: url("cursor.png") 16 16, auto;
            }

            #cursor
            {
                box-shadow:
                0 0 5px #ff4fa0,
                0 0 15px #ff4fa0;
                width: 15px;
                height: 15px;
                border: 2px solid rgba(255,255,255,0.7);
                border-radius: 50%;
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                transform: translate(-50%, -50%);
                backdrop-filter: blur(3px);
                background: rgba(255,255,255,0.08);
                z-index: 9999;
            }

        </style>
    </head>
    <body class="min-h-screen bg-gradient-to-br from-rose-100 via-pink-50 to-orange-100 text-gray-800">
        <main class="flex flex-col items-center justify-center p-6">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">
                🐱 Random Myths & Facts
            </h1>
            <p class="mb-8 text-center text-gray-700 max-w-lg">
                Click the button to reveal a random cat statement. It will show whether it's a
                <span class="font-semibold text-emerald-700">Fact</span> or a
                <span class ="font-semibold text-violet-600">Myth</span>
            </p>

            <div class="bg-white/80 backdrop-blur-md border border-white/50 rounded-3xl p-6 md:p-10 shadow-lg max-w-2xl w-full">
                 <div class="flex justify-center mb-4">
                    <span id="typeBadge" role="status"
                          class="px-4 py-2 rounded-full text-base font-bold bg-gray-200 text-gray-700">
                     Ready
                  </span>
                </div>
                
                <div class="border bprder-rose-100 bg-rose-50 p-6 rounded-xl text-center min-h-[120px] md:min-h-[160px] flex items-center justify-center shadow-inner">
                    <p id="statementText" class="text-xl md:text-2xl font-medium text-gray-800">
                        Click the button below to get a random cat myth or fact 🐾
                    </p>
                </div>

                <div class="mt-6 text-center">
                    <button id="generateBtn"
                        class="inline-flex items-center px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow transition-transform transform hover:scale-105 active:scale-95"
                        type="button">
                    Show Another
                    </button>
                </div>
            </div>
        </main>

        <script> 
            const catStatements = [
                {type: "fact", text: "Cats sleep for a large part of the day."},
                {type: "fact", text: "Cats sleep for around 12 to 16 hours a day on average."},
                {type: "fact", text: "A group of kittens is called a kindle."},
                {type: "fact", text: "A group of adult cats is called a clowder."},
                {type: "fact", text: "Cats use their whiskers to judge whether they can fit through small spaces."},
                {type: "fact", text: "A cat's nose print is unique, much like a human fingerprint."},
                {type: "fact", text: "Cats can rotate their ears up to 180 degrees."},
                {type: "fact", text: "Cats have over 20 muscles that control their ears."},
                {type: "fact", text: "Most cats have five toes on their front paws and four on their back paws."},
                {type: "fact", text: "Cats can jump up to six times their body length."},
                {type: "fact", text: "A cat's purr usually vibrates between 25 and 150 hertz."},
                {type: "fact", text: "Cats groom themselves to keep clean and regulate body temperature."},
                {type: "fact", text: "Cats spend a significant portion of their waking hours grooming."},
                {type: "fact", text: "Domestic cats can run at speeds of up to 30 miles (48 km) per hour."},
                {type: "fact", text: "Cats have excellent night vision compared to humans."},
                {type: "fact", text: "Cats cannot taste sweetness because they lack the necessary taste receptors."},
                {type: "fact", text: "A cat's sense of smell is much stronger than a human's."},
                {type: "fact", text: "Cats communicate through meows, purrs, chirps, hisses, and body language."},
                {type: "fact", text: "Adult cats usually meow mainly to communicate with humans."},
                {type: "fact", text: "Cats have retractable claws that help them climb and hunt."},
                {type: "fact", text: "The oldest known pet cat lived to be 38 years old."},
                {type: "fact", text: "Cats have a flexible spine that helps them move gracefully."},
                {type: "fact", text: "A healthy adult cat has around 230 bones."},
                {type: "fact", text: "Cats can squeeze through surprisingly narrow gaps because they lack a rigid collarbone."},
                {type: "fact", text: "Cats use their tails to help maintain balance."},
                {type: "fact", text: "Cats can make over 100 different vocal sounds."},
                {type: "fact", text: "The average cat's heart beats between 140 and 220 times per minute."},
                {type: "fact", text: "Cats have a special reflective layer in their eyes called the tapetum lucidum."},
                {type: "fact", text: "Kittens are born with their eyes closed."},
                {type: "fact", text: "Most kittens open their eyes within one to two weeks after birth."},
                {type: "fact", text: "Cats usually have 30 permanent teeth."},
                {type: "fact", text: "Cats can hear ultrasonic sounds that humans cannot."},
                {type: "fact", text: "Cats often knead soft surfaces as a comforting behavior learned in kittenhood."},
                {type: "fact", text: "A cat's rough tongue is covered with tiny backward-facing spines called papillae."},
                {type: "fact", text: "Cats use scent glands on their cheeks and forehead to mark territory."},
                {type: "fact", text: "Cats are obligate carnivores and require nutrients found in animal meat."},
                {type: "fact", text: "Cats have a third eyelid called the nictitating membrane."},
                {type: "fact", text: "The world's largest domestic cat breed is the Maine Coon."},
                {type: "fact", text: "Cats dream while they sleep, especially during REM sleep."},
                {type: "fact", text: "Most cats prefer running water over still water."},
                {type: "fact", text: "Cats can recognize their owner's voice."},
                {type: "fact", text: "A cat's pupils can become very large in low light."},
                {type: "fact", text: "Cats have an excellent sense of balance thanks to their inner ear."},
                {type: "fact", text: "Many cats enjoy sitting in sunny spots to stay warm."},
                {type: "fact", text: "Cats can remember places and routines for a long time."},
                {type: "fact", text: "Each cat has its own unique personality and behavior patterns."},
                {type: "fact", text: "Cats can learn tricks using positive reinforcement."},
                {type: "fact", text: "Domestic cats share about 95% of their DNA with tigers."},
                {type: "fact", text: "Cats often chirp or chatter when watching birds or squirrels."},
                {type: "fact", text: "A cat's whiskers are deeply connected to sensitive nerve endings."},
                {type: "fact", text: "Cats have lived alongside humans for thousands of years."},
                {type: "myth", text: "Cats can see perfectly in complete darkness."},
                {type: "myth", text: "Cats always land on their feet without getting hurt."},
                {type: "myth", text: "Black cats always bring bad luck."},
                {type: "myth", text: "Cats only purr when they are happy."},
                {type: "myth", text: "All cats hate water."},
                {type: "myth", text: "Milk is the perfect drink for every cat."},
                {type: "myth", text: "Cats cannot be trained."},
                {type: "myth", text: "Indoor cats never need vaccinations."},
                {type: "myth", text: "Cats don't need regular vet checkups."},
                {type: "myth", text: "Cats are completely independent and don't need attention."},
                {type: "myth", text: "A cat's whiskers should be trimmed."},
                {type: "myth", text: "Cats always use the litter box naturally."},
                {type: "myth", text: "Cats only meow when they are hungry."},
                {type: "myth", text: "Cats are nocturnal animals."},
                {type: "myth", text: "Cats don't recognize their owners."},
                {type: "myth", text: "Declawing a cat is a simple manicure."},
                {type: "myth", text: "Cats only eat fish."},
                {type: "myth", text: "Cats can't get attached to humans."},
                {type: "myth", text: "A wagging tail always means a cat is happy."},
                {type: "myth", text: "Cats don't feel emotions."},
                {type: "myth", text: "Cats always hate dogs."},
                {type: "myth", text: "Pregnant women should never own a cat."},
                {type: "myth", text: "Cats don't need exercise."},
                {type: "myth", text: "Cats cannot learn their names."},
                {type: "myth", text: "All calico cats are female."},
                {type: "myth", text: "Orange cats are always male."},
                {type: "myth", text: "Cats cannot get sunburned."},
                {type: "myth", text: "Cats can safely eat chocolate."},
                {type: "myth", text: "Cats always purr because they are healthy."},
                {type: "myth", text: "Cats don't need fresh water every day."},
                {type: "myth", text: "Cats only scratch furniture to be naughty."},
                {type: "myth", text: "Cats never miss their owners."},
                {type: "myth", text: "Cats can't be leash trained."},
                {type: "myth", text: "Every cat hates being held."},
                {type: "myth", text: "Cats should never be bathed under any circumstances."},
                {type: "myth", text: "Cats don't need dental care."},
                {type: "myth", text: "Cats can survive any fall from any height."},
                {type: "myth", text: "Cats cannot get bored."},
                {type: "myth", text: "Cats don't understand human emotions."},
                {type: "myth", text: "A dry nose means a cat is sick."},
                {type: "myth", text: "Cats should only eat dry food."},
                {type: "myth", text: "Cats don't need identification if they stay indoors."},
                {type: "myth", text: "All white cats are deaf."},
                {type: "myth", text: "Cats don't need playtime once they become adults."},
                {type: "myth", text: "Cats always know which plants are safe to eat."},
                {type: "myth", text: "Cats cannot catch colds."},
                {type: "myth", text: "Cats always prefer to be alone."},
                {type: "myth", text: "A cat that purrs cannot be in pain."},
                {type: "myth", text: "Cats don't need grooming because they clean themselves."},
                {type: "myth", text: "Cats are impossible to understand because they don't communicate."},
            
            ];

            const statementText = document.getElementById("statementText");
            const typeBadge = document.getElementById("typeBadge");
            const generateBtn = document.getElementById("generateBtn");

            function showRandomStatement()
            {
             if (catStatements.length === 0)
             {
                statementText.textContent = "No myths or facts added yet. Please edit y=the code.";
                typeBadge.textContent = "No Data";
                typeBadge.className = "px-4 py-2 rounded-full text-base font-bold bg-gray-200 text-gray-700";
                return;
             }

             const cursor = document.getElementById("cursor");

            let mouseX = 0;
            let mouseY = 0;

            let currentX = 0;
            let currentY = 0;

            document.addEventListener("mousemove", (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateCursor() {

                currentX += (mouseX - currentX) * 0.1;
                currentY += (mouseY - currentY) * 0.1;

                cursor.style.left = currentX + "px";
                cursor.style.top = currentY + "px";

                requestAnimationFrame(animateCursor);
            }

            animateCursor();

             const randomIndex = Math.floor(Math.random() * catStatements.length);
             const item = catStatements[randomIndex];

             statementText.textContent = item.text;

             if (item.type.toLowerCase() === "fact")
             {
                typeBadge.textContent = "FACT";
                typeBadge.className = "px-4 py-2 rounded-full text-base font-bold bg-emerald-100 text-emerald-800 border border-emerald-200";
             } else {
                typeBadge.textContent = "MYTH";
                typeBadge.className = "px-4 py-2 rounded-full text-base font-base font-bold bg-violet-100 text-violet-800 border border-violet-200";
             }
            }

            generateBtn.addEventListener("click", showRandomStatement);

            showRandomStatement();
        </script>
    </body>
    </html>
