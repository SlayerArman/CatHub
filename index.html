<!DOCTYPE html>

<html>
    <head>
        <title>CatHub</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">

        
        <style>
            body {
                background: linear-gradient(-45deg, pink, hotpink, lightpink, deeppink);
                background-size: 400% 400%;
                height: 100vh;
                margin: 0;
                animation: gradientmove 15 linear infinite;
                background-color: lightpink;
                font-family: Arial;
                text-align: center;
                padding: 20px 10px 20px 10px;}
        @keyframes gradientmove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }

        }
        @keyframes floatandfade {
            from {
                opacity: 0;
                top: 30px;
            }
            to{
                opacity: 1;
                top: 0px;
            }
        }
        </style>
    </head>

    <body>
        <h1     style="
                font-size: 100px;
                font-weight: 1500;
                font-family: 'Playwrite GB J', cursive;
                font-style: normal;
                font-optical-sizing: auto;
                animation: floatandfade 2s ease-in-out 1 forwards;
                position: relative;">
                <span style="color: white;">Cat </span><span style="color: blue;">Hub</span>
        </h1>
        <p      style="font-size: 20px;
                color: black;"> nothing here 
        </p>
    </body>

</html>
