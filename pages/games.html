<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name=""viewport content=""width=device-width, initial-scale="1.0">
        <title>CatHub Games</title>
        <style>
            :root
            {
                --bg-color: #f7f9fc;
                --card-bg: #ffffff;
                --primary: #ff9f43;
                --text: #2d3436;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            }

            body
            {
                text-align: center;
                font-family: 'Segoe UI', system-ui, sans-serif;
                background-color: var(--bg-color);
                color: var(--text);
                margin: 0;
                padding: 20px;
            }

            h1{margin-bottom: 10px; color: var(--text);}

            nav
            {
                margin: 20px auto 40px auto;
                background: var(--card-bg);
                padding: 10px;
                border-radius: 30px;
                display: inline-flex;
                gap: 10px;
                box-shadow: var(--shadow);
            }

            nav button
            {
                padding: 12px 24px;
                font-size: 1rem;
                font-weight: 600;
                border: none;
                border-radius: 20px;
                cursor: pointer;
                transition: all 0.2s ease;
                background: transparent;
                color: #7f8c8d;
            }

            nav button.active
            {
                background: var(--primary);
                color: white;
                box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3);
            }

            #game-container
            {
                max-width: 600px;
                margin: 0 auto;
            }

            .game-view
            {
                display: none;
                background: var(--card-bg);
                padding: 30px;
                border-radius: 20px;
                box-shadow: var(--shadow);
                animation: fadeIn 0.4s ease;
            }

            .game-view.active {display: block;}

            @keyframes fadeIn
            {
                from{opacity: 0; transform: translateY(10px);}
                to{opacity: 1; transform: traslateY(0);}
            }

            /*Cat Clicker*/
            .clicker-box{display: flex; flex-direction: column; align-items: center;}

            #cat-btn
            {
                font-size: 80px;
                background: none;
                border: none;
                cursor: pointer;
                transition: transform 0.1s ease;
                user-select: none;
                margin: 20px 0;
            }

            #cat-btn:active{transform: scale(0.85);}

            .stat-container{display: flex; gap: 20px; margin-bottom: 20px;}
            .stat{font-size: 1.2rem; background: #f8f9fa; padding: 10px 20px; border-radius: 10px; font-weight: bold;}
            .stat span{color: var(--primary);}

            .upgrade-btn
            {
                padding: 12px 24px;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
                border: none;
                border-radius: 10px;
                transition: all 0.2s;
            }

            .upgrade-btn:disabled{background-color: #dee2e6; color: #adb5bd; cursor: not-allowed;}
            .upgrade-btn:enabled{background-color: #2ed573; color: white; box-shadow: 0 4px 12px rgba(46, 213, 115, 0.2);}

            /*Cat Memory Match*/
            .grid-container
            {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .memory-grid
            {
                display: grid;
                grid-template-columns: repeat(4, 80px);
                gap: 12px;
                justify-content: center;
            }

            .card
            {
                width: 80px;
                height: 80px;
                background: #dfe4ea;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                cursor: pointer;
                user-select: none;
                transition: all 0.2s ease;
                box-shadow: 0 4pc 6px rgba(0, 0, 0, 0.05);
            }

            .cardflipped{background: #ffeaa7; transform: rotateY(180deg);}
            .card.matched{background: #2ed573; color: white; cursor: default; transform: scale(0.95); opacity: 0.7;}

            #memory-msg{font-size: 1.2rem; font-weight: bold; color: #2ed573; height: 24px;}
            </style>
    </head>

    <body>
        <h1>🐾 CatHub Games 🐾</h1>

        <nav>
            <button id="nav-clicker" onclick="switchGame('cat-clicker')" class="active">Cat Clicker</button>
            <button id="nav-memory" onClick="switchGame('cat-memory')">Cat Memory Match</button>
        </nav>

        <div id="game-container">
            <div id="cat-clicker" class="game-view active">
                <div class="clicker-box">
                    <h2>Cat Clicker</h2>
                    <div class="start-container">
                        <div class="start">Treats: <span id="treat-count">0</span></div>
                        <div class="stat">Per Sec: <span id="cps">0.0</span></div>
                    </div>
                    <button id="cat-btn">🐱</button>
                    <button id="buy-feeder" class="uprade-btn">Buy Auto-Feeder (Cost: 10)</button>
                </div>
            </div>
            
            <div id="cat-memory" class="game-view">
                <div class="grid-container">
                    <h2>Cat Memory Match</h2>
                    <div id="memory-msg"></div>
                    <div id="memory-grid" class="memory-grid"></div>
                    <button onclick="initMemoryGame()" class="uprade-btn" style="background-color: var(--primary); color: white;">Restart Game</button>
                </div>
            </div>
        </div>

        <script>
            let clickerInterval = null;

            function switchGame(gameId)
            {
                document.querySelectorAll('.game-view').forEach(view => view.classList.remove('active'));
                document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));

                if (gameId !== 'cat-clicker' && clickerInterval)
            {
                clearInterval(clickerInterval);
                clickerInterval = null;
            }

            document.getElementById(gameId).classList.add('active');
            if(gameId === 'cat-clicker') document.getElementById('nav-clicker').classList.add('active');
            if(gameId === 'cat-memory') document.getElementById('nav-memory').classList.add('active');

            if(gameId === 'cat-clicker'){
                initClickerGame();
            } else if (gameId === 'cat-memory'){
                initMemoryGame();
            }
            }

            // Cat Clicker Logic
            let clickerState = {treats: 0, feeders: 0, cost: 10};

            function initClickerGame()
            {
                const saved = JSON.parse(localStorage.getItem('catGameSave'));
                if (saved) clickerState = saved;

                updateClickerDisplay();

                if(clickerInterval) clearInterval(clickerInterval);

                clickerInterval = setInterval(() => {
                    clickerState.treats += (clickerState.feeders * 0.1);
                    updateClickerDisplay();
                }, 100);
            }

            function updateClickerDisplay()
            {
                document.getElemntById('treat-count')
            }
        </script>
    </body>
</html>
